version: '3.7'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    command: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker src.geostab_api.main:app --bind 0.0.0.0:8000"
    environment:
      MYSQL_HOST: ${INACAP_DB_HOST}
      MYSQL_USER: capitan
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_SECRET}
      MYSQL_DATABASE: GeoStab
      PYTHONPATH: /app/src
      GEOSTAB_API_KEY: ${GEOSTAB_API_KEY}
    expose:
      - "8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: always
    command: "streamlit run streamlit_app.py --server.port=8501"
    environment:
      FASTAPI_URL: http://api:8000
      GEOSTAB_API_KEY: ${GEOSTAB_API_KEY}
    depends_on:
      - api
    expose:
      - "8501"

  nginx:
    image: nginx:stable-alpine
    container_name: geostab_nginx
    restart: always
    environment:
      DOMAIN_NAME: geostab.ddns.net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - ui

  certbot:
    image: certbot/certbot
    env_file:
      - .env
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: "renew --webroot -w /var/www/certbot"

volumes:
  certbot_www:
    driver: local
  certbot_conf:
    driver: local
