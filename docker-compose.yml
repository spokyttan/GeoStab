version: '3.7'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    environment:
      MYSQL_HOST: ${INACAP_DB_HOST}
      MYSQL_USER: capitan
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_SECRET}
      MYSQL_DATABASE: GeoStab
      GEOSTAB_API_KEY: ${GEOSTAB_API_KEY}
      ALLOWED_ORIGINS: http://localhost:8501,https://geostab.ddns.net,http://localhost:8000
    expose:
      - "8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: always
    depends_on:
      - api
    expose:
      - "8501"

  vitality-guard:
    build:
      context: .
      dockerfile: Dockerfile.vitality
    restart: always
    environment:
      PYTHONUNBUFFERED: 1

  nginx:
    image: nginx:stable-alpine
    container_name: geostab_nginx
    restart: always
    environment:
      DOMAIN_NAME: geostab.ddns.net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - ui

  certbot:
    image: certbot/certbot
    env_file:
      - .env
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: "renew --webroot -w /var/www/certbot"

volumes:
  certbot_www:
    driver: local
  certbot_conf:
    driver: local
