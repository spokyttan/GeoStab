# geostab/nginx/conf.d/geostab_production.conf

# ------------------------------
# 1. Servidor HTTP (Redirección y Renovación)
# ------------------------------
server {
    listen 80;
    server_name geostab.ddns.net;

    # Permite que Certbot acceda al webroot para renovaciones futuras.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecciona todo el tráfico HTTP restante a HTTPS de forma permanente.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------
# 2. Servidor HTTPS (Terminación SSL y Proxy Inverso)
# ------------------------------
server {
    listen 443 ssl http2;
    server_name geostab.ddns.net;

    # Rutas de Certificado. Estas rutas se encuentran en el volumen persistente 'certbot_conf'.
    ssl_certificate /etc/letsencrypt/live/geostab.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geostab.ddns.net/privkey.pem;

    # Configuración de seguridad SSL robusta 
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # Proxy para la API (FastAPI)
    location /api/ {
        proxy_pass http://api:8000;
    }

    # Proxy para la UI (Streamlit)
    location / {
        proxy_pass http://ui:8501;
    }
}