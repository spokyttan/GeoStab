upstream api_server {
    server api:8000;
}

upstream ui_server {
    server ui:8501;
}

# Servidor HTTP - Solo para renovación y redirección
server {
    listen 80;
    server_name geostab.ddns.net;

    # Para renovaciones de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirige todo a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS - Configuración completa
server {
    listen 443 ssl http2;
    server_name geostab.ddns.net;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/geostab.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geostab.ddns.net/privkey.pem;

    # Seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # Proxy para la API
    location /api/ {
        rewrite /api/(.*) /$1 break;
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para la UI (Streamlit)
    location / {
        proxy_pass http://ui_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers especiales para Streamlit WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}